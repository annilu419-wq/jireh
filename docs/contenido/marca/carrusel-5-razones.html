<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EC;--surface:#FFFDF8;--t1:#221E17;--t2:#5C554A;--t3:#6B6454;--a:#2F6D8C}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;background:var(--bg);font-family:'Sora','Segoe UI',sans-serif;color:var(--t1);overflow:hidden}
.s{position:relative;width:1080px;height:1350px;padding:96px 88px;display:flex;flex-direction:column}
.s::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 100% 0%,rgba(47,109,140,.10),transparent 70%),radial-gradient(700px 600px at 0% 100%,rgba(201,138,14,.07),transparent 70%)}
.s>*{position:relative}
.top{display:flex;align-items:center;gap:16px;font-weight:700;font-size:34px}
.top svg{width:56px;height:56px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center}
.num{font-size:210px;font-weight:800;line-height:1;color:var(--a);letter-spacing:-.04em}
h1{font-size:84px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin-top:24px}
h1 em{font-style:normal;color:var(--a)}
p{font-size:46px;line-height:1.35;color:var(--t2);margin-top:36px;max-width:820px;font-weight:400}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:30px;color:var(--t3)}
.dots{display:flex;gap:12px}.dots i{width:14px;height:14px;border-radius:50%;background:rgba(47,109,140,.2)}.dots i.on{background:var(--a);width:40px;border-radius:8px}
.hair{height:3px;width:160px;background:linear-gradient(90deg,var(--a),rgba(47,109,140,0));border-radius:3px;margin-top:40px}
.cta{margin-top:48px;display:inline-block;background:var(--a);color:#FBF6EC;font-weight:700;font-size:44px;padding:30px 48px;border-radius:24px;align-self:flex-start}
</style></head><body><div class="s" id="s"></div>
<script>
const logo=`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="25.5" stroke="#2F6D8C" stroke-opacity=".38" stroke-width="1.6"/><g fill="#2F6D8C" fill-opacity=".16"><path d="M32 32 46 18 34.5 29.5Z"/><path d="M32 32 46 46 29.5 34.5Z"/><path d="M32 32 18 46 29.5 34.5Z"/><path d="M32 32 18 18 34.5 29.5Z"/></g><path d="M32 3 35 30 32 32Z" fill="#C98A0E"/><path d="M32 3 29 30 32 32Z" fill="#C98A0E" fill-opacity=".55"/><path d="M32 60 35 34 32 32Z" fill="#2F6D8C"/><path d="M32 60 29 34 32 32Z" fill="#2F6D8C" fill-opacity=".55"/><path d="M60 32 34 29 32 32Z" fill="#2F6D8C"/><path d="M60 32 34 35 32 32Z" fill="#2F6D8C" fill-opacity=".55"/><path d="M4 32 30 29 32 32Z" fill="#2F6D8C"/><path d="M4 32 30 35 32 32Z" fill="#2F6D8C" fill-opacity=".55"/><circle cx="32" cy="32" r="3.6" fill="#2F6D8C"/><circle cx="32" cy="32" r="1.5" fill="#FBF6EC"/></svg>`;
const D=[
 {t:'5 razones por las que <em>dejas la Biblia</em> a los 4 días',p:'Y no es falta de fe. Desliza 👉'},
 {n:'1',t:'Te pierdes entre <em>reyes y profetas</em>',p:'Nadie te dijo en qué época vas ni quién viene antes.'},
 {n:'2',t:'No sabes <em>quién está hablando</em>',p:'El autor, la época y el lugar cambian todo lo que lees.'},
 {n:'3',t:'Los capítulos se sienten <em>larguísimos</em>',p:'Sin una guía, 30 versículos pesan como 300.'},
 {n:'4',t:'Empiezas por <em>donde no es</em>',p:'Sin un orden, el día 3 te topas con algo que apaga a cualquiera.'},
 {n:'5',t:'Falla un día y llega <em>la culpa</em>',p:'Sientes que ya perdiste y dejas de volver.'},
 {t:'Hay una forma <em>en orden</em>',p:'Jireh te explica la Biblia en 5 minutos al día. Sin culpa.',cta:'Entra desde el link de mi perfil'}
];
const i=(+location.hash.slice(1)||1)-1,d=D[i];
document.getElementById('s').innerHTML=`
<div class="top">${logo}Jireh</div>
<div class="main">${d.n?`<div class="num">${d.n}</div>`:''}<h1>${d.t}</h1><div class="hair"></div><p>${d.p}</p>${d.cta?`<div class="cta">${d.cta}</div>`:''}</div>
<div class="foot"><span>@jirehbibliaapp</span><div class="dots">${D.map((_,k)=>`<i class="${k==i?'on':''}"></i>`).join('')}</div></div>`;
</script></body></html>
