<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EC;--t1:#221E17;--t2:#5C554A;--a:#2F6D8C}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);font-family:'Sora','Segoe UI',sans-serif;color:var(--t1);overflow:hidden}
.s{position:relative;width:1080px;height:1920px;padding:260px 96px 380px;display:flex;flex-direction:column;justify-content:center}
.s::before{content:"";position:absolute;inset:0;background:radial-gradient(1000px 900px at 100% 0%,rgba(47,109,140,.12),transparent 70%),radial-gradient(800px 700px at 0% 100%,rgba(201,138,14,.08),transparent 70%)}
.s>*{position:relative}
.logo{position:absolute;top:150px;left:96px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:38px}
.logo svg{width:64px;height:64px}
h1{font-size:112px;line-height:1.08;font-weight:800;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--a)}
.hair{height:4px;width:200px;background:linear-gradient(90deg,var(--a),rgba(47,109,140,0));border-radius:4px;margin-top:56px}
p{font-size:54px;line-height:1.35;color:var(--t2);margin-top:44px;max-width:860px}
.handle{position:absolute;left:96px;bottom:300px;font-size:36px;color:var(--t2)}
</style></head><body><div class="s" id="s"></div>
<script>
const logo=`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="25.5" stroke="#2F6D8C" stroke-opacity=".38" stroke-width="1.6"/><g fill="#2F6D8C" fill-opacity=".16"><path d="M32 32 46 18 34.5 29.5Z"/><path d="M32 32 46 46 29.5 34.5Z"/><path d="M32 32 18 46 29.5 34.5Z"/><path d="M32 32 18 18 34.5 29.5Z"/></g><path d="M32 3 35 30 32 32Z" fill="#C98A0E"/><path d="M32 3 29 30 32 32Z" fill="#C98A0E" fill-opacity=".55"/><path d="M32 60 35 34 32 32Z" fill="#2F6D8C"/><path d="M32 60 29 34 32 32Z" fill="#2F6D8C" fill-opacity=".55"/><path d="M60 32 34 29 32 32Z" fill="#2F6D8C"/><path d="M60 32 34 35 32 32Z" fill="#2F6D8C" fill-opacity=".55"/><path d="M4 32 30 29 32 32Z" fill="#2F6D8C"/><path d="M4 32 30 35 32 32Z" fill="#2F6D8C" fill-opacity=".55"/><circle cx="32" cy="32" r="3.6" fill="#2F6D8C"/><circle cx="32" cy="32" r="1.5" fill="#FBF6EC"/></svg>`;
const D=[
 {t:'Abres la Biblia <em>con ganas…</em>'},
 {t:'y a los 4 días la dejas <em>con culpa.</em>'},
 {t:'No es que te falte <em>fe.</em>'},
 {t:'Es que nadie te dio <em>un mapa.</em>'},
 {t:'Jireh te explica la Biblia <em>en orden</em>',p:'En 5 minutos al día.'},
 {t:'Sin culpa. <em>Muy pronto.</em>',p:'Entra a la lista de espera desde el link de mi perfil.'}
];
const i=(+location.hash.slice(1)||1)-1,d=D[i];
document.getElementById('s').innerHTML=`<div class="logo">${logo}Jireh</div><h1>${d.t}</h1><div class="hair"></div>${d.p?`<p>${d.p}</p>`:''}<div class="handle">@jirehbibliaapp</div>`;
</script></body></html>
